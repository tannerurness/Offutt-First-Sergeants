<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offutt AFB First Sergeant Resource Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #111827;
      --accent-yellow: #f59e0b;
      --emergency-red: #991b1b;
      --action-green: #15803d;
      --text-white: #f3f4f6;
      --text-gray: #9ca3af;
      --card-white: #fefcf6;
      --card-border: #374151;
      --tag-orange: #9a3412;
      --tag-blue: #1e40af;
      --tag-green: #166534;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: 70px;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }

    .btn-back, .btn-edit-toggle {
      background-color: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--accent-yellow);
      font-size: 12px;
      font-weight: 700;
      padding: 9px 14px;
      border-radius: 24px;
      cursor: pointer;
    }

    .btn-edit-toggle.active {
      background-color: var(--accent-yellow);
      color: #111827;
      border-color: var(--accent-yellow);
    }

    header {
      text-align: center;
      padding: 20px 10px 14px 10px;
    }

    .compass-icon {
      font-size: 32px;
      margin-bottom: 6px;
    }

    .resource-badge {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--accent-yellow);
      font-weight: 700;
      margin-bottom: 6px;
      display: block;
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--text-gray);
      font-size: 0.92rem;
      line-height: 1.45;
      margin-bottom: 16px;
    }

    .btn-copy {
      background-color: transparent;
      border: 1px solid var(--text-gray);
      color: var(--text-white);
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1.5px;
      padding: 7px 22px;
      border-radius: 20px;
      cursor: pointer;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    /* Section Containers (Used for Front Page Unit Grids & Unit Quick-Call Grids) */
    .grid-section, .quick-call-section {
      border: 1px solid var(--card-border);
      background-color: rgba(17, 24, 39, 0.75);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .section-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-label {
      color: var(--accent-yellow);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* 3x3 Button Grid (Shared by Front Page Units & Unit Emergency Calls) */
    .button-grid, .quick-call-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .grid-btn, .call-btn {
      position: relative;
      border: none;
      text-decoration: none;
      background-color: var(--card-white);
      color: #111827;
      border-radius: 8px;
      padding: 12px 6px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 66px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .grid-btn:active, .call-btn:active {
      transform: scale(0.95);
    }

    .call-btn.emergency {
      background-color: var(--emergency-red);
      color: white;
    }

    .grid-btn h3, .call-btn h3 {
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 3px;
      line-height: 1.2;
    }

    .grid-btn span, .call-btn span {
      font-size: 9.5px;
      opacity: 0.85;
    }

    /* QR Box */
    .qr-container {
      text-align: center;
      margin-bottom: 22px;
    }

    .qr-box {
      border: 2px solid var(--accent-yellow);
      background-color: white;
      padding: 8px;
      border-radius: 12px;
      display: inline-block;
    }

    .qr-box img {
      display: block;
      width: 120px;
      height: 120px;
    }

    .qr-caption {
      color: var(--text-gray);
      font-size: 11px;
      margin-top: 6px;
    }

    /* Category Filter Pills */
    .filters-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 18px;
      scrollbar-width: none;
    }

    .filters-scroll::-webkit-scrollbar { display: none; }

    .filter-pill {
      background-color: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-gray);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-pill.active {
      background-color: var(--accent-yellow);
      color: #111827;
      border-color: var(--accent-yellow);
    }

    /* Ticket-Stub Document Cards */
    .document-list, .embed-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 20px;
    }

    .doc-card {
      text-decoration: none;
      background-color: var(--card-white);
      color: #111827;
      border-radius: 12px;
      padding: 20px;
      position: relative;
      display: block;
      transition: transform 0.15s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .doc-card::before, .doc-card::after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      height: 6px;
      background-size: 12px 6px;
    }

    .doc-card::before {
      top: -3px;
      background-image: radial-gradient(circle at 6px -3px, transparent 6px, var(--card-white) 7px);
    }

    .doc-card::after {
      bottom: -3px;
      background-image: radial-gradient(circle at 6px 9px, transparent 6px, var(--card-white) 7px);
    }

    .doc-tag {
      background-color: var(--tag-orange);
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .doc-tag.blue { background-color: var(--tag-blue); }
    .doc-tag.green { background-color: var(--tag-green); }

    .doc-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 6px;
      padding-right: 28px;
    }

    .doc-desc {
      font-size: 12px;
      color: #4b5563;
      line-height: 1.4;
    }

    .arrow-icon {
      position: absolute;
      right: 20px;
      top: 20px;
      font-size: 16px;
      color: #9ca3af;
    }

    /* Embed Cards */
    .embed-card {
      background-color: #1f2937;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      position: relative;
    }

    .embed-card h3 {
      font-size: 0.95rem;
      color: var(--accent-yellow);
      margin-bottom: 10px;
    }

    .embed-frame-wrap {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    .embed-frame-wrap iframe {
      width: 100%;
      height: 260px;
      border: none;
      display: block;
    }

    /* ================= SHIRT ADMIN EDITOR PANEL ================= */
    .admin-panel {
      border: 2px solid var(--accent-yellow);
      background-color: #1e293b;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .admin-panel h2 {
      font-size: 1rem;
      color: var(--accent-yellow);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

      color: var(--text-gray);
